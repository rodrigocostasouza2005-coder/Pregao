name: DIAG temporario - agrupamento de noticias (somente leitura)
on:
  push:
    branches: [diag/news-agrupamento-20261018]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python diag_news.py 2>&1 | grep -v "No runtime found\|ScriptRunContext"
        env:
          PYTHONUNBUFFERED: "1"
