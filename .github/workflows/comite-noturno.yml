name: Comitê de Investimentos — análise noturna

on:
  schedule:
    # 19h45 de Brasília (UTC-3), de segunda a sexta.
    - cron: "45 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comite-noturno
  cancel-in-progress: false

jobs:
  analisar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar credenciais do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::Configure SUPABASE_URL e SUPABASE_SECRET_KEY em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Executar Comitê sobre watchlists e carteiras recomendadas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
          PYTHONUNBUFFERED: "1"
        run: python -m jobs.comite_noturno
