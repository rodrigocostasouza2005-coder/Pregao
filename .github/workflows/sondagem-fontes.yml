# TEMPORÁRIO (22/10/2026): sondagem de fontes de research a partir do runner
# (o sandbox não tem rede). Roda só em push desta branch de trabalho e é
# removido antes do merge. Só leitura, sem secrets.
name: Sondagem de fontes (temporário)
on:
  push:
    branches: [claude/intelligent-cray-yubpk5]
    paths: [scripts/sondar_fontes.py, scripts/previa_morning_call.py, .github/workflows/sondagem-fontes.yml]
permissions:
  contents: read
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests feedparser
      - run: python scripts/sondar_fontes.py
  previa-morning-call:
    # sem secrets: só dados públicos; nada é enviado nem gravado
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python scripts/previa_morning_call.py
