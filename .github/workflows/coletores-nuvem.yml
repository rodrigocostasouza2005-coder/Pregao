name: Coletores na nuvem

on:
  schedule:
    # Horário comercial de Brasília (UTC-3): seg-sex, 07:00–20:00.
    # GitHub Actions usa UTC; evita execuções noturnas/fins de semana.
    # Minutos quebrados de proposito: o GitHub descarta disparos de
    # schedule sob carga, e :00/:30 sao os horarios mais congestionados
    # (ver comentario em radar-morning-call.yml e MANUAL.md).
    - cron: "11,41 10-22 * * 1-5"
    - cron: "11 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coletores-nuvem
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar configuracao segura
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::Configure SUPABASE_URL e SUPABASE_SECRET_KEY em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Executar coletores
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # GROQ_API_KEY e' opcional de proposito (nao entra na checagem
          # "Validar configuracao segura" acima) - sem ela,
          # config.obter_credenciais_groq() devolve None e todo resumo de
          # IA (pregerar_resumos_news) degrada pra "indisponivel" com
          # seguranca, sem quebrar o resto da coleta. Configure em
          # Settings > Secrets and variables > Actions pra habilitar a
          # pre-geracao de resumos de NEWS na nuvem.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
          PYTHONUNBUFFERED: "1"
        run: python coletor_local.py

      - name: Executar Coordenador de Inteligência / Backoffice
        # Reaproveita este MESMO cron (~30min, seg-sex 07-20h BRT) em vez
        # de criar um workflow novo - auditoria "Coordenador de
        # Inteligência" (2026-10-29, ver docs/auditoria-coordenador-
        # inteligencia-20261029.md): data/market_researcher.py e
        # data/sintese_mercado.py já existiam e já são testados, só
        # rodavam sob clique/visita no Streamlit, nunca em agendamento.
        # Roda DEPOIS dos coletores (consome o que eles persistiram
        # nesta mesma execução) - falha aqui nunca derruba o step
        # anterior, que já terminou.
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # GEMINI_API_KEY e' opcional de proposito (mesmo padrao do
          # GROQ_API_KEY acima) - usado so' por jobs.coordenador:_rodar_embeddings
          # (data/research/embeddings.py:indexar_pendentes, Memoria de
          # Research/RAG). Sem ela, config.obter_credenciais_gemini()
          # devolve None e indexar_pendentes() degrada com seguranca
          # (processados=0, sem erro) - achado real (2026-11-01): esta
          # credencial ja existia nos secrets do Streamlit Cloud mas
          # NUNCA foi repassada pra este workflow (cofres de secret
          # diferentes, mesmo padrao historico do GROQ_API_KEY) -
          # configure em Settings > Secrets and variables > Actions pra
          # habilitar a indexacao agendada na nuvem.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -m jobs.coordenador
