name: Coletores na nuvem

on:
  schedule:
    # Executa a cada 30 minutos, inclusive com o computador desligado.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coletores-nuvem
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar configuracao segura
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::Configure SUPABASE_URL e SUPABASE_SECRET_KEY em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Executar coletores
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
          PYTHONUNBUFFERED: "1"
        run: python coletor_local.py
