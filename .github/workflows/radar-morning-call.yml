name: Radar e Morning Call

on:
  schedule:
    # B3: 10:00-17:00 BRT = 13:00-20:00 UTC, weekdays. Every 15 minutes.
    - cron: "*/15 13-19 * * 1-5"
    - cron: "0 20 * * 1-5"
    # Morning Call at 08:00 BRT (America/Sao_Paulo, UTC-3, sem horário de
    # verão desde 2019) on weekdays. 08:00 BRT = 11:00 UTC.
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      job:
        description: "Qual rotina executar"
        required: true
        type: choice
        options:
          - ambos
          - radar
          - morning_call
      teste_destinatario:
        description: >-
          (opcional, só pro Morning Call) envia só um e-mail de TESTE pra
          este endereço - nunca dispara pros assinantes opt-in reais
        required: false
        type: string

permissions:
  contents: read

jobs:
  radar:
    if: >-
      github.repository == 'rodrigocostasouza2005-coder/Pregao' && (
      github.event_name == 'schedule' && (github.event.schedule == '*/15 13-19 * * 1-5' || github.event.schedule == '0 20 * * 1-5')
      || github.event_name == 'workflow_dispatch' && (inputs.job == 'radar' || inputs.job == 'ambos'))
    # A carteira recomendada da Genial so' responde de rede residencial
    # (11/11 execucoes no ubuntu-latest falharam por timeout) - roda no
    # runner self-hosted do PC de casa, ver coletores-casa.yml (mesmas
    # regras de seguranca: so' schedule/workflow_dispatch neste arquivo).
    runs-on: [self-hosted, pregao-casa]
    timeout-minutes: 12
    # concurrency por job (nao por workflow): com o PC desligado o radar
    # fica na fila, e isso nao pode segurar o Morning Call, que roda na nuvem.
    concurrency:
      group: pregao-radar
      cancel-in-progress: false
    # Mesmo esquema de Python do coletores-casa.yml (Windows, shell cmd,
    # venv persistente compartilhado no PC de casa).
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Python (venv persistente no PC)
        run: python -m venv "${{ runner.tool_cache }}\venv-pregao"
      - name: Instalar dependencias
        run: |
          "${{ runner.tool_cache }}\venv-pregao\Scripts\python.exe" -m pip install --disable-pip-version-check -q -r requirements.txt
      - name: Validar credenciais Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          "${{ runner.tool_cache }}\venv-pregao\Scripts\python.exe" -m jobs.checar_env SUPABASE_URL SUPABASE_SECRET_KEY
      - name: Monitorar quedas em carteiras
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PYTHONUTF8: "1"
        run: |
          "${{ runner.tool_cache }}\venv-pregao\Scripts\python.exe" -m jobs.radar_quedas
  morning-call:
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '0 11 * * 1-5'
      || github.event_name == 'workflow_dispatch' && (inputs.job == 'morning_call' || inputs.job == 'ambos')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: pregao-morning-call
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Enviar Morning Call
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Destinatarios reais do envio AGENDADO vem dos assinantes
          # opt-in (user_prefs), nunca de um EMAIL_TO fixo - ver
          # data/user_prefs.py:listar_assinantes_morning_call.
          # MORNING_CALL_TESTE_PARA so' existe em disparo manual
          # (workflow_dispatch) com o input teste_destinatario
          # preenchido; em qualquer outro caso (cron, ou dispatch sem o
          # campo) fica vazio e o job roda em modo AGENDADO normal (ver
          # jobs/morning_call.py:__main__).
          MORNING_CALL_TESTE_PARA: ${{ inputs.teste_destinatario }}
        run: python -m jobs.morning_call
