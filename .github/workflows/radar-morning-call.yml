name: Radar e Morning Call

on:
  schedule:
    # O GitHub DESCARTA disparos de `schedule` sob carga - medido de
    # verdade (2026-10-18): de ~220 disparos esperados entre 14 e 17/10
    # (este workflow + coletores-nuvem.yml), so' 23 aconteceram, e zero
    # na sexta 17/10 inteira (Morning Call das 08h nao saiu). Minutos
    # "redondos" (:00/:15/:30/:45) sao os mais congestionados, por isso
    # todos os horarios abaixo usam minutos quebrados. Isso REDUZ a perda,
    # nao garante - o disparo externo confiavel esta' em MANUAL.md
    # ("Disparo externo dos agendamentos").
    #
    # Radar - B3 10:00-17:00 BRT = 13:00-20:00 UTC, dias uteis, a cada 15min.
    - cron: "4,19,34,49 13-19 * * 1-5"
    - cron: "4 20 * * 1-5"
    # Morning Call - 08:03 BRT (UTC-3, sem horario de verao desde 2019)
    # + 3 disparos de reserva. O envio e' idempotente por dia e por
    # destinatario (jobs/morning_call.py:_ja_enviado_hoje): o primeiro que
    # o GitHub entregar envia, os seguintes so' confirmam "ja enviado".
    - cron: "3 11 * * 1-5"
    - cron: "17 11 * * 1-5"
    - cron: "27 11 * * 1-5"
    - cron: "38 11 * * 1-5"
    - cron: "52 11 * * 1-5"
    - cron: "7 12 * * 1-5"
    - cron: "27 12 * * 1-5"
    - cron: "47 12 * * 1-5"
  workflow_dispatch:
    inputs:
      job:
        description: "Qual rotina executar"
        required: true
        type: choice
        options:
          - ambos
          - radar
          - morning_call
      teste_destinatario:
        description: >-
          (opcional, só pro Morning Call) envia só um e-mail de TESTE pra
          este endereço - nunca dispara pros assinantes opt-in reais
        required: false
        type: string

permissions:
  contents: read

jobs:
  radar:
    if: >-
      github.event_name == 'schedule' && contains(fromJSON('["4,19,34,49 13-19 * * 1-5", "4 20 * * 1-5"]'), github.event.schedule)
      || github.event_name == 'workflow_dispatch' && (inputs.job == 'radar' || inputs.job == 'ambos')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # concurrency por JOB (antes era do workflow inteiro): o GitHub mantem
    # so' 1 execucao pendente por grupo e cancela a anterior - com um grupo
    # unico, um Radar enfileirado podia derrubar o Morning Call pendente.
    concurrency:
      group: pregao-radar
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Validar credenciais Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "::error::Configure SUPABASE_URL em Actions secrets"; exit 1)
          test -n "$SUPABASE_SECRET_KEY" || (echo "::error::Configure SUPABASE_SECRET_KEY em Actions secrets"; exit 1)
      - name: Monitorar quedas em carteiras
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m jobs.radar_quedas
  morning-call:
    if: >-
      github.event_name == 'schedule' && contains(fromJSON('["3 11 * * 1-5", "17 11 * * 1-5", "38 11 * * 1-5", "7 12 * * 1-5"]'), github.event.schedule)
      || github.event_name == 'workflow_dispatch' && (inputs.job == 'morning_call' || inputs.job == 'ambos')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: pregao-morning-call
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Enviar Morning Call
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Destinatarios reais do envio AGENDADO vem dos assinantes
          # opt-in (user_prefs), nunca de um EMAIL_TO fixo - ver
          # data/user_prefs.py:listar_assinantes_morning_call.
          # MORNING_CALL_TESTE_PARA so' existe em disparo manual
          # (workflow_dispatch) com o input teste_destinatario
          # preenchido; em qualquer outro caso (cron, ou dispatch sem o
          # campo) fica vazio e o job roda em modo AGENDADO normal (ver
          # jobs/morning_call.py:__main__).
          MORNING_CALL_TESTE_PARA: ${{ inputs.teste_destinatario }}
        run: python -m jobs.morning_call
