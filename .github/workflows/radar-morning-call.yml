name: Radar e Morning Call

on:
  schedule:
    # B3: 10:00-17:00 BRT = 13:00-20:00 UTC, weekdays. Every 15 minutes.
    - cron: "*/15 13-19 * * 1-5"
    - cron: "0 20 * * 1-5"
    # Morning Call at 08:00 BRT (America/Sao_Paulo, UTC-3, sem horário de
    # verão desde 2019) on weekdays. 08:00 BRT = 11:00 UTC.
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      job:
        description: "Qual rotina executar"
        required: true
        type: choice
        options:
          - ambos
          - radar
          - morning_call
      teste_destinatario:
        description: >-
          (opcional, só pro Morning Call) envia só um e-mail de TESTE pra
          este endereço - nunca dispara pros assinantes opt-in reais
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pregao-radar-morning-call
  cancel-in-progress: false

jobs:
  radar:
    if: >-
      github.event_name == 'schedule' && (github.event.schedule == '*/15 13-19 * * 1-5' || github.event.schedule == '0 20 * * 1-5')
      || github.event_name == 'workflow_dispatch' && (inputs.job == 'radar' || inputs.job == 'ambos')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Validar credenciais Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "::error::Configure SUPABASE_URL em Actions secrets"; exit 1)
          test -n "$SUPABASE_SECRET_KEY" || (echo "::error::Configure SUPABASE_SECRET_KEY em Actions secrets"; exit 1)
      - name: Monitorar quedas em carteiras
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m jobs.radar_quedas
  morning-call:
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '0 11 * * 1-5'
      || github.event_name == 'workflow_dispatch' && (inputs.job == 'morning_call' || inputs.job == 'ambos')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Enviar Morning Call
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # Destinatários reais vêm dos assinantes opt-in (user_prefs),
          # nunca de um EMAIL_TO fixo - ver data/user_prefs.py:
          # listar_assinantes_morning_call. MORNING_CALL_TESTE_PARA só
          # existe em disparo manual (workflow_dispatch) com o input
          # teste_destinatario preenchido; em qualquer outro caso (cron,
          # ou dispatch sem o campo) fica vazio e o job roda em modo
          # AGENDADO normal (ver jobs/morning_call.py:__main__).
          MORNING_CALL_TESTE_PARA: ${{ inputs.teste_destinatario }}
        run: python -m jobs.morning_call
