name: Testes dos coletores

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Executar testes automatizados
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
        run: python -m pytest -q
      - name: Gerar PDF de prévia para inspeção visual
        if: success() && github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tests")
          import morning_call_amostras as amostras
          from jobs.morning_call_pdf import gerar_pdf
          Path("morning-call-preview.pdf").write_bytes(gerar_pdf(amostras.edicao_tipica(), {}))
          PY
      - name: Publicar PDF de prévia
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: morning-call-pdf-preview
          path: morning-call-preview.pdf
          retention-days: 7
